<!doctype html><html lang="es"><head><base href="/app/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA ficticio · cierre administrativo</title><style>body{margin:0;background:#f3f8fc;color:#17354e;font:15px system-ui}.card{padding:14px;margin:10px 0;border:1px solid #d2e5f0;border-radius:12px;background:white}.btn{padding:12px;margin:5px;border:1px solid #96bdd3;border-radius:9px;background:#edf7fc;font:inherit;color:#17354e}p{overflow-wrap:anywhere}[hidden]{display:none!important}</style></head><body><main><h1>QA ficticio</h1><p>Sin Firebase ni datos de producción.</p></main>
<script src="../core/transaction-store.js"></script><script src="../core/sync-errors.js"></script><script src="../core/offline-operation-queue.js"></script>
<script>
if(location.hostname!=='127.0.0.1')throw Error('FICTITIOUS_LOOPBACK_ONLY');
const uid='qa-admin-mobile',key='mi-cartera-v2-cloud-operations:'+uid;window.QA_KEY=key;
window.MiCarteraV2AuthCloudGate={state:()=>({ready:true,uid,role:'admin'}),requireReady:()=>({ready:true,uid,role:'admin'})};
localStorage.setItem('mi-cartera-v2-local-owner',uid);localStorage.setItem('mi-cartera-v2-validation-state',JSON.stringify({clients:[{id:'qa-client-0',name:'Cliente ficticio 1'},{id:'qa-client-1',name:'Cliente ficticio 2'}],credits:[],payments:[],cashMovements:[],audit:[],session:{actorId:uid,role:'admin'}}));
const rows=Array.from({length:2},(_,i)=>({id:'qa-mobile-original-'+i,status:i?'PENDIENTE':'ERROR',attempts:i?0:8,lastError:i?null:'NETWORK_TIMEOUT',createdAt:'2026-10-03T15:00:00Z',operation:{id:'qa-mobile-original-'+i,operationId:'qa-mobile-original-'+i,actorId:uid,type:'PAYMENT',writes:[{kind:'create',path:'payments/qa-mobile-'+i,data:{id:'qa-mobile-'+i,amount:10,clientId:'qa-client-'+i,date:'2026-10-03',version:1},expectedVersion:0}]}}));localStorage.setItem(key,JSON.stringify(rows,null,2));window.QA_ORIGINAL=localStorage.getItem(key);window.QA_FINANCIAL=localStorage.getItem('mi-cartera-v2-validation-state');
window.QA_POLICY_READY=Promise.all(rows.map(async x=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(uid+'|'+x.id+'|'+MiCarteraV2Store.fingerprint(x.operation)));return Array.from(new Uint8Array(d),v=>v.toString(16).padStart(2,'0')).join('')})).then(hashes=>window.MI_CARTERA_ADMIN_CLOSURE_AUTHORIZATION={reference:'QA_FICTITIOUS_ADMIN_APPROVAL',reason:'CLOUD_HTTP_429',hashes});
</script><script src="pending-review-v2.js"></script><script>QA_POLICY_READY.then(()=>MiCarteraV2PendingReview.open());</script></body></html>
