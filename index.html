<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14532d"><link rel="manifest" href="manifest.json"><title>Mi Cartera</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#17221b;font-family:Arial,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:76px}header{background:#14532d;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}header h1{font-size:20px;margin:0}header p{margin:5px 0 0;font-size:12px;opacity:.85}.page{display:none;padding:14px}.page.active{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0001;margin-bottom:12px}.label{font-size:12px;color:#657067}.big{font-size:22px;font-weight:700;margin-top:6px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#14532d;color:white}.light{background:#e8efe9;color:#14532d}.danger{background:#fee2e2;color:#b91c1c}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}input,select{width:100%;padding:11px;border:1px solid #ccd5ce;border-radius:9px;background:white}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#657067;margin-bottom:5px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 5px;border-bottom:1px solid #edf0ed;text-align:left}.pill{border-radius:99px;padding:4px 7px;font-weight:700;font-size:10px}.ok{background:#dcfce7;color:#15803d}.late{background:#fee2e2;color:#b91c1c}.today{background:#fef3c7;color:#a16207}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:6}.bottom button{background:none;border:0;padding:10px 9px;font-size:10px;font-weight:700;color:#59645c}.bottom button.active{color:#14532d}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:white;width:100%;max-width:720px;margin:auto;border-radius:18px 18px 0 0;padding:18px;max-height:90vh;overflow:auto}.empty{text-align:center;color:#657067;padding:20px}.notice{font-size:12px;background:#eff6ff;padding:11px;border-radius:9px;margin-bottom:12px}@media(min-width:700px){.bottom{left:50%;right:auto;width:720px;transform:translateX(-50%)}}\n</style></head><body><div class="app"><header><h1>💰 Mi Cartera</h1><p>Control de préstamos y cobranzas</p></header>
<main>
<section id="home" class="page active"><h2>Resumen</h2><div class="cards"><div class="card"><div class="label">Capital colocado</div><div class="big" id="a">S/ 0.00</div></div><div class="card"><div class="label">Saldo pendiente</div><div class="big" id="b">S/ 0.00</div></div><div class="card"><div class="label">Cobrado</div><div class="big" id="c">S/ 0.00</div></div><div class="card"><div class="label">Vencido</div><div class="big" id="d">S/ 0.00</div></div></div><div class="card"><h3>Cobranzas próximas</h3><div id="next"></div></div></section>
<section id="clients" class="page"><div class="row"><h2 style="flex:2">Clientes</h2><button class="btn primary" onclick="clientForm()">+ Cliente</button></div><input id="search" placeholder="Buscar cliente..." oninput="renderClients()"><div id="clientList" style="margin-top:12px"></div></section>
<section id="loans" class="page"><div class="row"><h2 style="flex:2">Préstamos</h2><button class="btn primary" onclick="loanForm()">+ Préstamo</button></div><div id="loanList"></div></section>
<section id="collect" class="page"><h2>Cobranzas</h2><div class="cards"><div class="card"><div class="label">Hoy</div><div class="big" id="ct">S/ 0</div></div><div class="card"><div class="label">Atrasado</div><div class="big" id="cl">S/ 0</div></div></div><div class="card"><div id="collectList"></div></div></section>
</main><div class="bottom"><button class="active" onclick="go('home',this)">🏠<br>Inicio</button><button onclick="go('clients',this)">👥<br>Clientes</button><button onclick="go('loans',this)">💰<br>Préstamos</button><button onclick="go('collect',this)">📅<br>Cobranzas</button></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const K='mi_cartera_v2';let db=JSON.parse(localStorage.getItem(K)||'{"clients":[],"loans":[]}');
const $=x=>document.getElementById(x), money=n=>'S/ '+(+n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{let x=new Date();return new Date(x.getFullYear(),x.getMonth(),x.getDate())};
const iso=s=>new Date(s+'T00:00:00');
function save(){localStorage.setItem(K,JSON.stringify(db));render()}
function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function closeM(){$('modal').classList.remove('show')}
function clientForm(id=''){let c=db.clients.find(x=>x.id===id)||{};$('sheet').innerHTML=`<h2>${id?'Editar':'Nuevo'} cliente</h2><div class=field><label>Nombre completo</label><input id=n value="${c.name||''}"></div><div class=field><label>DNI</label><input id=dni value="${c.dni||''}"></div><div class=field><label>Teléfono</label><input id=phone value="${c.phone||''}"></div><div class=field><label>Dirección</label><input id=addr value="${c.addr||''}"></div><div class=row><button class="btn primary" onclick="saveClient('${id}')">Guardar</button><button class="btn light" onclick="closeM()">Cancelar</button></div>`;$('modal').classList.add('show')}
function saveClient(id){if(!n.value.trim())return alert('Ingresa el nombre');let x={id:id||crypto.randomUUID(),name:n.value.trim(),dni:dni.value.trim(),phone:phone.value.trim(),addr:addr.value.trim()};if(id)db.clients=db.clients.map(c=>c.id===id?x:c);else db.clients.push(x);closeM();save()}
function renderClients(){let q=($('search')?.value||'').toLowerCase();let ar=db.clients.filter(c=>(c.name+c.dni+c.phone).toLowerCase().includes(q));$('clientList').innerHTML=ar.length?ar.map(c=>`<div class=card><b>${c.name}</b><div class=label>${c.dni||'Sin DNI'} · ${c.phone||'Sin teléfono'}</div><div class=row style="margin-top:9px"><button class="btn light" onclick="clientDetail('${c.id}')">Ver</button><button class="btn primary" onclick="loanForm('${c.id}')">Prestar</button></div></div>`).join(''):'<div class=empty>No hay clientes.</div>'}
function loanForm(cid=''){if(!cid&&!db.clients.length)return alert('Primero registra un cliente');$('sheet').innerHTML=`<h2>Nuevo préstamo</h2><div class=field><label>Cliente</label><select id=lc>${db.clients.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${c.name} — ${c.dni}</option>`).join('')}</select></div><div class=field><label>Monto (S/)</label><input id=amt type=number step=.01 min=0></div><div class=field><label>Interés total sobre capital (%)</label><input id=rate type=number step=.01 min=0 value=20></div><div class=field><label>Número de cuotas</label><input id=num type=number min=1 value=10></div><div class=field><label>Frecuencia</label><select id=freq><option value=diaria>Diaria</option><option value=semanal selected>Semanal</option><option value=quincenal>Quincenal</option><option value=mensual>Mensual</option></select></div><div class=field><label>Primera cuota</label><input id=start type=date value="${new Date().toISOString().slice(0,10)}"></div><div class=notice>Esta versión calcula interés simple sobre el capital y divide el total uniformemente entre las cuotas.</div><div class=row><button class="btn primary" onclick="saveLoan()">Crear</button><button class="btn light" onclick="closeM()">Cancelar</button></div>`;$('modal').classList.add('show')}
function addDate(s,f,i){let x=iso(s);if(f==='diaria')x.setDate(x.getDate()+i);if(f==='semanal')x.setDate(x.getDate()+7*i);if(f==='quincenal')x.setDate(x.getDate()+15*i);if(f==='mensual')x.setMonth(x.getMonth()+i);return x.toISOString().slice(0,10)}
function saveLoan(){let A=+amt.value,R=+rate.value,N=+num.value;if(!(A>0&&N>0))return alert('Revisa monto y cuotas');let intr=A*R/100,total=A+intr,l={id:crypto.randomUUID(),clientId:lc.value,amount:A,rate:R,n:N,freq:freq.value,start:start.value,total,inst:[]};for(let i=0;i<N;i++)l.inst.push({id:crypto.randomUUID(),n:i+1,date:addDate(l.start,l.freq,i),due:total/N,paid:0});db.loans.push(l);closeM();save();alert('Préstamo creado')}
function paid(l){return l.inst.reduce((s,x)=>s+x.paid,0)}function balance(l){return l.total-paid(l)}
function state(x){if(x.paid>=x.due-.01)return ['Pagada','ok'];let t=today(),d=iso(x.date);if(d<t)return ['Vencida','late'];if(d.getTime()===t.getTime())return ['Hoy','today'];return ['Pendiente','today']}
function renderLoans(){$('loanList').innerHTML=db.loans.length?db.loans.slice().reverse().map(l=>{let c=db.clients.find(x=>x.id===l.clientId)||{};return `<div class=card><b>${c.name}</b><div class=label>Capital ${money(l.amount)} · Total ${money(l.total)}</div><p>Saldo: <b>${money(balance(l))}</b></p><button class="btn light" onclick="detail('${l.id}')">Cronograma</button> <button class="btn primary" onclick="pay('${l.id}')">Cobrar</button></div>`}).join(''):'<div class=empty>No hay préstamos.</div>'}
function detail(id){let l=db.loans.find(x=>x.id===id),c=db.clients.find(x=>x.id===l.clientId)||{};$('sheet').innerHTML=`<h2>${c.name}</h2><p>Préstamo: <b>${money(l.amount)}</b> · Saldo: <b>${money(balance(l))}</b></p><table><tr><th>#</th><th>Fecha</th><th>Cuota</th><th>Pagado</th><th>Estado</th></tr>${l.inst.map(x=>{let s=state(x);return `<tr><td>${x.n}</td><td>${x.date}</td><td>${money(x.due)}</td><td>${money(x.paid)}</td><td><span class="pill ${s[1]}">${s[0]}</span></td></tr>`}).join('')}</table><button class="btn primary" style="margin-top:12px" onclick="pay('${id}')">Registrar pago</button> <button class="btn light" onclick="closeM()">Cerrar</button>`;$('modal').classList.add('show')}
function pay(id){let l=db.loans.find(x=>x.id===id),p=l.inst.filter(x=>x.paid<x.due-.01);if(!p.length)return alert('Préstamo cancelado');$('sheet').innerHTML=`<h2>Registrar pago</h2><div class=field><label>Cuota</label><select id=pi>${p.map(x=>`<option value="${x.id}">Cuota ${x.n} — ${x.date} — ${money(x.due-x.paid)}</option>`).join('')}</select></div><div class=field><label>Monto recibido</label><input id=pa type=number step=.01 value="${p[0].due-p[0].paid}"></div><div class=field><label>Fecha</label><input id=pd type=date value="${new Date().toISOString().slice(0,10)}"></div><button class="btn primary" onclick="savePay('${id}')">Guardar pago</button> <button class="btn light" onclick="closeM()">Cancelar</button>`;$('modal').classList.add('show')}
function savePay(id){let l=db.loans.find(x=>x.id===id),x=l.inst.find(y=>y.id===pi.value),v=+pa.value;if(!(v>0)||v>x.due-x.paid+.01)return alert('Monto inválido');x.paid+=v;closeM();save();alert('Pago registrado')}
function clientDetail(id){let c=db.clients.find(x=>x.id===id),ls=db.loans.filter(l=>l.clientId===id);$('sheet').innerHTML=`<h2>${c.name}</h2><p>DNI: ${c.dni||'-'}<br>Teléfono: ${c.phone||'-'}<br>Dirección: ${c.addr||'-'}</p><h3>Préstamos</h3>${ls.length?ls.map(l=>`<div class=card>${money(l.amount)} · saldo ${money(balance(l))}<br><button class="btn light" onclick="detail('${l.id}')">Ver</button></div>`).join(''):'<div class=empty>Sin préstamos.</div>'}<button class="btn light" onclick="closeM()">Cerrar</button>`;$('modal').classList.add('show')}
function renderCollect(){let t=today(),todayV=0,late=0,items=[];db.loans.forEach(l=>l.inst.forEach(x=>{let s=state(x),bal=x.due-x.paid;if(s[0]==='Hoy')todayV+=bal;if(s[0]==='Vencida')late+=bal;if(s[0]!=='Pagada')items.push({l,x,s})}));$('ct').textContent=money(todayV);$('cl').textContent=money(late);items.sort((u,v)=>u.x.date.localeCompare(v.x.date));$('collectList').innerHTML=items.length?items.map(z=>{let c=db.clients.find(c=>c.id===z.l.clientId)||{};return `<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${c.name}</b><br>Cuota ${z.x.n} · ${z.x.date} · ${money(z.x.due-z.x.paid)} <span class="pill ${z.s[1]}">${z.s[0]}</span><br><button class="btn primary" style="margin-top:6px" onclick="pay('${z.l.id}')">Cobrar</button></div>`}).join(''):'<div class=empty>Todo al día.</div>'}
function renderHome(){let placed=db.loans.reduce((s,l)=>s+l.amount,0),bal=db.loans.reduce((s,l)=>s+Math.max(0,balance(l)),0),col=db.loans.reduce((s,l)=>s+paid(l),0),late=0,up=[];db.loans.forEach(l=>l.inst.forEach(x=>{let s=state(x);if(s[0]==='Vencida')late+=x.due-x.paid;if(s[0]!=='Pagada')up.push({l,x,s})}));$('a').textContent=money(placed);$('b').textContent=money(bal);$('c').textContent=money(col);$('d').textContent=money(late);up.sort((u,v)=>u.x.date.localeCompare(v.x.date));$('next').innerHTML=up.slice(0,5).map(z=>{let c=db.clients.find(c=>c.id===z.l.clientId)||{};return `<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${c.name}</b> · ${z.x.date} · ${money(z.x.due-z.x.paid)} <span class="pill ${z.s[1]}">${z.s[0]}</span></div>`}).join('')||'<div class=empty>Sin cobranzas pendientes.</div>'}
function render(){renderHome();renderClients();renderLoans();renderCollect()}render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
