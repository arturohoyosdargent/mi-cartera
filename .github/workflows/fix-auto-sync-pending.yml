name: Fix auto sync pending
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auto sync after Cloud login
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firebase-cloud-core.js')
          s=p.read_text(encoding='utf-8')
          old="""        await pullCloud();
        await pushLocalAllowed();
        localStorage.setItem(SEED_KEY,'1');
        toast('Sesión Cloud iniciada');"""
          new="""        await pullCloud();
        await pushLocalAllowed();
        const pendingAfterLogin=(db.syncQueue||[]).filter(x=>x.status==='PENDIENTE'||x.status==='ERROR');
        if(pendingAfterLogin.length){
          try{
            await pushLocalAllowed();
            const pendingNow=(db.syncQueue||[]).filter(x=>x.status==='PENDIENTE'||x.status==='ERROR');
            for(const item of pendingNow){
              if(item.type==='CLIENTE_ELIMINADO'&&item.payload?.id!=null){
                await deleteDoc(doc(fs,`orgs/${orgId}/clients`,String(item.payload.id)));
              }
            }
            pendingAfterLogin.forEach(x=>{x.status='SINCRONIZADO';x.syncedAt=new Date().toISOString();x.error='';});
            db.settings=db.settings||{};
            db.settings.lastOnline=new Date().toISOString();
            saveCloudDb();
          }catch(syncErr){console.warn('Sincronización automática post-login:',syncErr)}
        }
        localStorage.setItem(SEED_KEY,'1');
        updateUI();
        try{updateSyncUI();renderAll()}catch(_){ }
        toast('Sesión Cloud iniciada');"""
          if old not in s:
              raise SystemExit('Patrón no encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firebase-cloud-core.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Sincronizar pendientes automáticamente al iniciar sesión'
          git push
