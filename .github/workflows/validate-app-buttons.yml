name: Validar app
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar HTML y JavaScript inline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts:
              raise SystemExit('ERROR: no se encontró JavaScript inline en index.html')
          Path('/tmp/app-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('Scripts inline encontrados:',len(scripts))
          print('firebase-cloud.js referenciado:', 'firebase-cloud.js' in s)
          print('backup.js referenciado:', 'backup.js' in s)
          print('Funciones onclick presentes:', s.count('onclick='))
          PY
          node --check /tmp/app-inline.js
          echo 'VALIDACION_JS_OK'
