name: Hotfix V2 complete runtime stable6
on:
  push:
    branches: [post-final4-business]
    paths: ['.github/workflows/hotfix-write-runtime.yml']
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-final4-business
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair runtime renewal loader and offline cache
        run: |
          python3 - <<'PY'
          files=['v2/app/durable-actions-stable6.js','v2/app/durable-actions-v2.js','v2/app/write-actions-stable12.js']
          bad="Number(q.balance??q.amount||0)"; good="Number((q.balance??q.amount)||0)"
          for p in files:
            s=open(p,encoding='utf-8').read(); s=s.replace(bad,good); open(p,'w',encoding='utf-8').write(s)
          p='v2/app/operational-cards-v2.js'; s=open(p,encoding='utf-8').read()
          old="function renew(id){const fn=root.MiCarteraV2DurableActions?.openRenewal;if(typeof fn!=='function')return alert('Renovación no disponible. Actualiza la aplicación.');return fn(id)}function renewInterest(id){const fn=root.MiCarteraV2DurableActions?.renewInterest;if(typeof fn!=='function')return alert('Renovación no disponible. Actualiza la aplicación.');return fn(id)}function refinance(id){const fn=root.MiCarteraV2DurableActions?.refinance;if(typeof fn!=='function')return alert('Renovación no disponible. Actualiza la aplicación.');return fn(id)}"
          new="let renewalReload=null;async function renewalFn(name){let fn=root.MiCarteraV2RenewalActions?.[name];if(typeof fn==='function')return fn;if(!renewalReload)renewalReload=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='renewal-actions-stable10.js?runtime='+Date.now();s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar renovación.'));document.head.appendChild(s)}).finally(()=>{renewalReload=null});await renewalReload;fn=root.MiCarteraV2RenewalActions?.[name];if(typeof fn!=='function')throw new Error('No se pudo iniciar renovación.');return fn}async function renew(id){try{return (await renewalFn('openRenewal'))(id)}catch(e){alert(e.message)}}async function renewInterest(id){try{return (await renewalFn('renewInterest'))(id)}catch(e){alert(e.message)}}async function refinance(id){try{return (await renewalFn('refinance'))(id)}catch(e){alert(e.message)}}"
          if s.count(old)!=1: raise SystemExit('renewal block mismatch')
          open(p,'w',encoding='utf-8').write(s.replace(old,new))
          p='v2/app/operational-shell.html'; s=open(p,encoding='utf-8').read()
          old='<script src="operational-controller.js"></script><script>document.write(\'<script src="operational-cards-v2.js?v=v2-pilot-20260924-b2-stable-3"><\\\\/script>\')</script><script>document.write(\'<script src="durable-actions-v2.js?v=v2-pilot-20260924-b2-stable-3"><\\\\/script>\')</script>'
          new='<script src="operational-controller.js"></script><script src="durable-actions-stable6.js?v=v2-pilot-20260924-b2-stable-6"></script><script>document.write(\'<script src="operational-cards-v2.js?v=v2-pilot-20260924-b2-stable-3"><\\\\/script>\')</script>'
          if s.count(old)!=1: raise SystemExit('loader block mismatch')
          open(p,'w',encoding='utf-8').write(s.replace(old,new))
          p='v2/app/service-worker.js'; s=open(p,encoding='utf-8').read()
          if "'./durable-actions-v2.js'" not in s: raise SystemExit('service worker durable cache target missing')
          open(p,'w',encoding='utf-8').write(s.replace("'./durable-actions-v2.js'","'./durable-actions-stable6.js'"))
          PY
      - name: JavaScript syntax gate
        run: |
          set -e
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find v2/app v2/core v2/cloud -type f -name '*.js' -print0)
      - name: Full V2 regression suite
        run: |
          set -e
          for f in v2/tests/*.spec.js; do echo "=== $f ==="; node "$f"; done
      - name: Commit only after all tests pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/app/durable-actions-stable6.js v2/app/durable-actions-v2.js v2/app/write-actions-stable12.js v2/app/operational-cards-v2.js v2/app/operational-shell.html v2/app/service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(v2): restore validated stable6 runtime and renewal path'
          git push origin HEAD:post-final4-business
