name: Repair only failed V2 promise agenda regression
on:
  push:
    branches: [post-final4-business]
    paths: ['.github/workflows/hotfix-write-runtime.yml']
permissions:
  contents: write
jobs:
  repair-failed-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-final4-business
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore only the known-good promise-aware agenda
        run: |
          set -e
          SOURCE=bd07e4348779989e9472ba8a2ff4e883b6a6bc6b
          git show "$SOURCE:v2/app/agenda-v2.js" > v2/app/agenda-v2.js
      - name: Parse only corrected agenda
        run: node --check v2/app/agenda-v2.js
      - name: Re-run only the previously failing regression
        run: node v2/tests/payment-promise-reversal.spec.js
      - name: Commit only corrected agenda after targeted PASS
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/app/agenda-v2.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(v2): restore promise-aware agenda after targeted regression'
          git push origin HEAD:post-final4-business
