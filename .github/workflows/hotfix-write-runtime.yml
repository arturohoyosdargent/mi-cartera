name: Repair only remaining V2 promise regression
on:
  push:
    branches: [post-final4-business]
    paths: ['.github/workflows/hotfix-write-runtime.yml']
permissions:
  contents: write
jobs:
  repair-failed-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-final4-business
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore only files proven by the failed regression
        run: |
          set -e
          CARDS=3fe9d4c69d57bddb6d9f55c60da5493d88bde8e9
          RUNTIME=bd07e4348779989e9472ba8a2ff4e883b6a6bc6b
          git show "$CARDS:v2/app/operational-cards-v2.js" > v2/app/operational-cards-v2.js
          git show "$RUNTIME:v2/app/agenda-v2.js" > v2/app/agenda-v2.js
          git show "$RUNTIME:v2/app/operational-shell.html" > v2/app/operational-shell.html
      - name: Parse only corrected JavaScript files
        run: |
          node --check v2/app/operational-cards-v2.js
          node --check v2/app/agenda-v2.js
      - name: Re-run only the previously failing regression
        run: node v2/tests/payment-promise-reversal.spec.js
      - name: Commit only corrected dependency set after targeted PASS
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/app/operational-cards-v2.js v2/app/agenda-v2.js v2/app/operational-shell.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(v2): restore approved promise runtime dependency set'
          git push origin HEAD:post-final4-business
