name: Validate Codex V2 self-healing integrated runtime
on:
  push:
    branches: [post-final4-business]
    paths: ['.github/workflows/hotfix-write-runtime.yml']
permissions:
  contents: write
jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-final4-business
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble self-healing Codex candidate
        run: |
          set -e
          RUNTIME=bd07e4348779989e9472ba8a2ff4e883b6a6bc6b
          CARDS=3fe9d4c69d57bddb6d9f55c60da5493d88bde8e9
          for f in operational-cards-v2.js agenda-v2.js; do git show "$CARDS:v2/app/$f" > "v2/app/$f"; done
          for f in operational-shell.html service-worker.js release.json durable-actions-stable6.js renewal-actions-stable10.js promise-actions-stable11.js write-actions-stable12.js; do git show "$RUNTIME:v2/app/$f" > "v2/app/$f"; done
          python3 - <<'PY'
          import re
          files=['v2/app/durable-actions-stable6.js','v2/app/durable-actions-v2.js','v2/app/write-actions-stable12.js','v2/app/renewal-actions-stable10.js','v2/app/promise-actions-stable11.js']
          bad="Number(q.balance??q.amount||0)"; good="Number((q.balance??q.amount)||0)"
          for p in files:
            s=open(p,encoding='utf-8').read(); s=s.replace(bad,good); open(p,'w',encoding='utf-8').write(s)
          p='v2/app/operational-shell.html'; s=open(p,encoding='utf-8').read(); s=re.sub(r'durable-actions-stable6\.js\?v=[^"\']+','durable-actions-stable6.js?v=v2-pilot-20260924-b2-stable-6',s); open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Parse every V2 JavaScript file
        run: |
          set -e
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find v2/app v2/core v2/cloud -type f -name '*.js' -print0)
      - name: Run every V2 regression test
        run: |
          set -e
          for f in v2/tests/*.spec.js; do echo "=== $f ==="; node "$f"; done
      - name: Commit only after every test passes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/app/operational-cards-v2.js v2/app/agenda-v2.js v2/app/operational-shell.html v2/app/service-worker.js v2/app/release.json v2/app/durable-actions-stable6.js v2/app/durable-actions-v2.js v2/app/renewal-actions-stable10.js v2/app/promise-actions-stable11.js v2/app/write-actions-stable12.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(v2): restore Codex self-healing integrated runtime after exhaustive QA'
          git push origin HEAD:post-final4-business
