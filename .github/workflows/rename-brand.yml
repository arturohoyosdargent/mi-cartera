name: Renombrar a Préstamo Ya
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar marca
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for old,new in [('Mi Cartera PRO V21 Cloud','Préstamo Ya'),('Mi Cartera PRO','Préstamo Ya'),('mi-cartera-backup-','prestamo-ya-backup-')]:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          p=Path('manifest.webmanifest')
          s=p.read_text(encoding='utf-8').replace('Mi Cartera PRO V21 Cloud','Préstamo Ya').replace('Mi Cartera PRO','Préstamo Ya')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'Préstamo Ya' index.html
          grep -q 'Préstamo Ya' manifest.webmanifest
          node --check backup.js
      - name: Publicar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Aplicar marca Préstamo Ya en la app'
          git push
