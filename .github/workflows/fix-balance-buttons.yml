name: Corregir acciones de Balance
on:
  push:
    paths:
      - .github/workflows/fix-balance-buttons.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Agregar funciones faltantes de Balance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'function openCashForm(' in s or 'window.openCashForm=' in s:
              print('Funciones ya presentes; no se modifica index.html')
          else:
              add = r'''\nfunction openCashForm(type){const isEntry=type==='entry';const label=isEntry?'ENTRADA / INGRESO':'GASTO / SALIDA';const amountRaw=window.prompt(label+'\\nIngrese el monto en soles:','0');if(amountRaw===null)return;const amount=Number(String(amountRaw).replace(',','.'));if(!Number.isFinite(amount)||amount<=0)return toast('Ingrese un monto válido');const detail=window.prompt('Detalle / concepto:',isEntry?'Ingreso adicional':'Gasto operativo');if(detail===null)return;const date=window.prompt('Fecha (AAAA-MM-DD):',today())||today();const item={id:Date.now(),date,amount,detail:String(detail).trim()||label};if(isEntry)db.entries.push(item);else db.expenses.push(item);audit(isEntry?'ENTRADA_CAJA':'GASTO_CAJA',item.detail+' · '+money(amount));persist();renderBalance();toast(label+' registrado');}\nfunction removeCashItem(type){const arr=type==='entry'?db.entries:db.expenses;if(!arr.length)return toast('No hay movimientos para quitar');const item=arr[arr.length-1];if(!confirm('¿Quitar el último movimiento?\\n'+fmt(item.date)+' · '+item.detail+' · '+money(Number(item.amount||0))))return;arr.pop();audit(type==='entry'?'ELIMINAR_ENTRADA_CAJA':'ELIMINAR_GASTO_CAJA',item.detail+' · '+money(Number(item.amount||0)));persist();renderBalance();toast('Movimiento eliminado');}\n'''
              marker='</script>'
              pos=s.rfind(marker)
              if pos<0: raise SystemExit('No se encontró cierre de script')
              s=s[:pos]+add+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validar JavaScript antes de publicar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('No se encontraron scripts')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --check
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir botones de entradas y gastos en Balance" || exit 0
          git push
      - name: Eliminar workflow temporal
        if: always()
        run: |
          rm -f .github/workflows/fix-balance-buttons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar workflow temporal de Balance" || exit 0
          git push
