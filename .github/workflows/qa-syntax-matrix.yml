name: QA Syntax Matrix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          files=sorted(str(p) for p in Path('.').rglob('*.js') if 'node_modules' not in p.parts and '.git' not in p.parts)
          print('files='+json.dumps(files,separators=(',',':')))
          PY
  syntax:
    needs: enumerate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        file: ${{ fromJSON(needs.enumerate.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - name: Node syntax check
        run: node --check "${{ matrix.file }}"
