name: QA Syntax Matrix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node syntax check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/js-files.txt
          from pathlib import Path
          for p in sorted(Path('.').rglob('*.js')):
              if 'node_modules' not in p.parts and '.git' not in p.parts:
                  print(p)
          PY
          count=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "Checking $file"
            node --check "$file"
            count=$((count+1))
          done < /tmp/js-files.txt
          echo "Syntax OK: $count JavaScript files checked"
