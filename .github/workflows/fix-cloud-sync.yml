name: Fix Cloud Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) La cola de contingencia usa Firebase cuando Cloud está disponible.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat=r"async function syncNow\(\)\{.*?\}\nfunction exportPending"
          repl="""async function syncNow(){
            if(!navigator.onLine)return toast('Sin internet: la información sigue guardada localmente.');
            const pending=db.syncQueue.filter(x=>x.status==='PENDIENTE'||x.status==='ERROR');
            if(!pending.length)return toast('No hay operaciones pendientes.');
            if(typeof window.cloudSyncNow==='function'){
              try{
                const ok=await window.cloudSyncNow();
                if(ok===true){
                  pending.forEach(x=>{x.status='SINCRONIZADO';x.syncedAt=new Date().toISOString()});
                  db.settings.lastOnline=new Date().toISOString();
                  persist();
                  updateSyncUI();
                  return toast('Sincronización Cloud completada.');
                }
              }catch(e){console.error(e);return toast('No se pudo sincronizar con Cloud.');}
            }
            const endpoint=(db.settings.syncEndpoint||'').trim();
            if(!endpoint)return toast('Inicia sesión en Cloud para sincronizar, o configura un endpoint en Parámetros.');
            for(const item of pending){
              try{item.attempts=(item.attempts||0)+1;const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});if(!r.ok)throw new Error('HTTP '+r.status);item.status='SINCRONIZADO';item.syncedAt=new Date().toISOString()}catch(e){item.status='ERROR';item.error=String(e)}}
            db.settings.lastOnline=new Date().toISOString();persist();updateSyncUI();toast('Sincronización procesada');
          }
          function exportPending"""
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se encontró syncNow en index.html')
          p.write_text(s2,encoding='utf-8')

          # 2) En Cloud, si ya hubo una sincronización inicial, primero se sube
          # lo local y luego se descarga lo remoto. Así no se pisan cambios offline.
          p=Path('firebase-cloud-core.js')
          s=p.read_text(encoding='utf-8')
          pat=r"window\.cloudSyncNow=async\(\)=>\{.*?\};\nfunction addMeta"
          repl="""window.cloudSyncNow=async()=>{if(!ready||!auth?.currentUser){toast('Inicia sesión en Cloud primero.');return false;}try{const seeded=localStorage.getItem(SEED_KEY)==='1';if(seeded){await pushLocalAllowed();await pullCloud();}else{await pullCloud();await pushLocalAllowed();localStorage.setItem(SEED_KEY,'1');}toast('Cloud sincronizado.');return true;}catch(e){console.error(e);toast('Error Cloud: '+(e.code||e.message));return false;}};
function addMeta"""
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se encontró cloudSyncNow en firebase-cloud-core.js')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html firebase-cloud-core.js
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Fix sincronización Cloud y cola offline [skip ci]"
          git push