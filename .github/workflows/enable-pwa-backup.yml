name: Enable PWA and Backup
on:
  push:
    paths:
      - '.github/workflows/enable-pwa-backup.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar PWA y respaldo
        run: python3 scripts/patch_pwa.py
      - name: Validar
        run: |
          node --check backup.js
          test -s manifest.webmanifest
          test -s sw.js
          grep -q 'manifest.webmanifest' index.html
          grep -q 'openBackupPanel' index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest icon.svg sw.js backup.js
          git diff --cached --quiet || git commit -m "Convertir Mi Cartera en app instalable con respaldo"
          git push
      - name: Eliminar workflow temporal
        if: always()
        run: |
          git rm -f .github/workflows/enable-pwa-backup.yml || true
          git commit -m "Eliminar workflow temporal PWA" || true
          git push || true
