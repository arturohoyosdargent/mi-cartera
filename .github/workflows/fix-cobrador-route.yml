name: Fix cobrador route pull

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix route assignment pull
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firebase-cloud-core.js')
          s=p.read_text(encoding='utf-8')
          old="data.routes=await pullCollection('routes',[where('collectorId','==',auth.currentUser.uid)]);const rids=data.routes.map(x=>x.id);"
          new="const assigned=routeIds().map(String);data.routes=await pullCollection('routes',[where('collectorId','==',auth.currentUser.uid)]);const rids=Array.from(new Set([...assigned,...data.routes.map(x=>String(x.id))]));"
          assert old in s, 'No se encontro el bloque de rutas del cobrador'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-cloud-core.js
          git commit -m "Fix cobrador route assignment pull"
          git push
