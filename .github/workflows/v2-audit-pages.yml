name: V2 Audit QA (sin publicacion)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact candidate SHA to audit; does not publish'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted QA control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject symbolic or injected candidate references
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node -e 'if (!/^[0-9a-f]{40}$/.test(process.env.CANDIDATE_SHA || "")) process.exit(1)'
      - name: Checkout exact QA candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected stable ancestry
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -eu
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C candidate merge-base --is-ancestor 43a7afa2ab629cdc7b4c7db9856dbd10eae61f71 "$CANDIDATE_SHA"
      - name: Install isolated regression dependencies
        run: npm ci --prefix candidate/v2/tests --ignore-scripts --no-audit --no-fund
      - name: Complete read-only synthetic regression
        run: node control/.github/scripts/publication-control.cjs qa candidate
      - name: Confirm audited source remains intact
        run: git -C candidate diff --exit-code
