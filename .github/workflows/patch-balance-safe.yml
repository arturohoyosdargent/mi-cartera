name: Mejorar Balance V21 de forma segura
on:
  push:
    paths:
      - .github/workflows/patch-balance-safe.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar mejora y validar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_section='''<section id="balance" class="page"><div class="sectionTitle">Balance y caja</div><div class="twocol"><div class="field"><label>Desde</label><input class="input" id="bDesde" type="date" onchange="renderBalance()"></div><div class="field"><label>Hasta cierre</label><input class="input" id="bHasta" type="date" onchange="renderBalance()"></div></div><div class="grid"><div class="card metric">Caja inicial<b id="bCajaInicial">S/0.00</b></div><div class="card metric">Cobrado<b id="bCobrado">S/0.00</b></div><div class="card metric">Otros ingresos<b id="bOtrosIngresos">S/0.00</b></div><div class="card metric">Ingresos totales<b id="bIngresos">S/0.00</b></div><div class="card metric">Créditos desembolsados<b id="bCreditos">S/0.00</b></div><div class="card metric">Gastos / salidas<b id="bGastos">S/0.00</b></div><div class="card metric">Egresos totales<b id="bEgresos">S/0.00</b></div><div class="card metric">Caja teórica<b id="bCaja">S/0.00</b></div></div><div class="card"><b>Entradas / ingresos adicionales</b><div id="entriesList"></div><div class="actionbar"><button class="btn blue" onclick="openCashForm('entry')">＋ Agregar entrada</button><button class="btn" onclick="removeCashItem('entry')">− Quitar último</button></div></div><div class="card"><b>Gastos / salidas adicionales</b><div id="expensesList"></div><div class="actionbar"><button class="btn blue" onclick="openCashForm('expense')">＋ Agregar gasto</button><button class="btn" onclick="removeCashItem('expense')">− Quitar último</button></div></div><div class="card"><b>Conciliación de caja</b><div class="field"><label>Caja física contada S/</label><input class="input" id="bCajaFisica" type="number" min="0" step="0.01" placeholder="Ingrese el efectivo contado" oninput="updateCashDifference()"></div><div class="grid"><div class="card metric">Diferencia<b id="bDiferencia">S/0.00</b></div><div class="card metric">Estado<b id="bEstado">SIN CONTAR</b></div></div><button class="btn green wide" onclick="closeCash()">🔒 Registrar cierre de caja</button></div><div class="actionbar"><button class="btn" onclick="showCashHistory()">📋 Ver historial de cierres</button><button class="btn blue" onclick="viewPortfolio()">Ver cartera</button></div><div class="card"><b>Último balance</b><div id="lastBalance"></div></div></section>'''
          pat=r'<section id="balance" class="page">.*?</section>(?=\s*<section id="reports")'
          s2,n=re.subn(pat,new_section,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se encontró exactamente la sección Balance')
          s=s2
          new_funcs='''function renderBalance(){const from=$(\'bDesde\')?.value||today(),to=$(\'bHasta\')?.value||today(),inr=x=>x&&x.date>=from&&x.date<=to;const base=Number(db.settings?.cashBase||0);const cob=db.payments.filter(inr).reduce((s,x)=>s+Number(x.amount||0),0);const cred=db.credits.filter(inr).reduce((s,x)=>s+Number(x.capital||0),0);const ent=db.entries.filter(inr).reduce((s,x)=>s+Number(x.amount||0),0);const cap=db.capital.filter(inr).reduce((s,x)=>s+Number(x.amount||0),0);const gastos=db.expenses.filter(inr).reduce((s,x)=>s+Number(x.amount||0),0);const otros=ent+cap;const ingresos=cob+otros;const egresos=cred+gastos;const caja=base+ingresos-egresos;$(\'bCajaInicial\').textContent=money(base);$(\'bCobrado\').textContent=money(cob);$(\'bOtrosIngresos\').textContent=money(otros);$(\'bIngresos\').textContent=money(ingresos);$(\'bCreditos\').textContent=money(cred);$(\'bGastos\').textContent=money(gastos);$(\'bEgresos\').textContent=money(egresos);$(\'bCaja\').textContent=money(caja);$(\'entriesList\').innerHTML=db.entries.filter(inr).concat(db.capital.filter(inr).map(x=>({...x,detail:\'Capital: \'+x.detail}))).map(x=>`<div class="info">${fmt(x.date)} · ${x.detail} <b>+${money(Number(x.amount||0))}</b></div>`).join(\'\')||\'<div class="info">Sin entradas adicionales.</div>\';$(\'expensesList\').innerHTML=db.expenses.filter(inr).map(x=>`<div class="info">${fmt(x.date)} · ${x.detail} <b>−${money(Number(x.amount||0))}</b></div>`).join(\'\')||\'<div class="info">Sin gastos adicionales.</div>\';updateCashDifference();$(\'lastBalance\').innerHTML=db.cashClosures.length?`${fmt(db.cashClosures.at(-1).date)} · Caja física ${money(Number(db.cashClosures.at(-1).physical||0))} · Diferencia ${money(Number(db.cashClosures.at(-1).difference||0))} · ${db.cashClosures.at(-1).status}`:\'Sin balance cerrado\'}
function updateCashDifference(){const el=$(\'bCajaFisica\'),theory=$(\'bCaja\');if(!el||!theory)return;const raw=el.value.trim();if(raw===\'\'){ $(\'bDiferencia\').textContent=money(0);$(\'bEstado\').textContent=\'SIN CONTAR\';return }const physical=Number(raw);const text=theory.textContent.replace(/[^0-9,.-]/g,\'\').replace(/,/g,\'.\');const theoretical=Number(text);const diff=physical-theoretical;$(\'bDiferencia\').textContent=money(diff);$(\'bEstado\').textContent=Math.abs(diff)<0.005?\'CUADRADO\':diff<0?\'FALTANTE\':\'SOBRANTE\'}
function closeCash(){const from=$(\'bDesde\').value||today(),to=$(\'bHasta\').value||today(),physical=Number($(\'bCajaFisica\').value);if(!Number.isFinite(physical)||physical<0)return toast(\'Ingrese la caja física contada\');const base=Number(db.settings?.cashBase||0),cob=db.payments.filter(x=>x.date>=from&&x.date<=to).reduce((s,x)=>s+Number(x.amount||0),0),cred=db.credits.filter(x=>x.date>=from&&x.date<=to).reduce((s,x)=>s+Number(x.capital||0),0),ent=db.entries.filter(x=>x.date>=from&&x.date<=to).reduce((s,x)=>s+Number(x.amount||0),0)+db.capital.filter(x=>x.date>=from&&x.date<=to).reduce((s,x)=>s+Number(x.amount||0),0),exp=db.expenses.filter(x=>x.date>=from&&x.date<=to).reduce((s,x)=>s+Number(x.amount||0),0),theoretical=base+cob+ent-cred-exp,difference=physical-theoretical,status=Math.abs(difference)<0.005?\'CUADRADO\':difference<0?\'FALTANTE\':\'SOBRANTE\';db.cashClosures.push({id:Date.now(),date:today(),from,to,theoretical,physical,difference,status});db.settings.cashBase=physical;audit(\'CIERRE_CAJA\',\'Físico \'+money(physical)+\' · Teórico \'+money(theoretical)+\' · \'+status);persist();toast(\'Cierre de caja registrado: \'+status)}
function showCashHistory(){let h=\'<div class="card"><h3>Historial de cierres</h3>\';if(!db.cashClosures.length)h+=\'<div class="info">No hay cierres registrados.</div>\';db.cashClosures.slice().reverse().forEach(x=>h+=`<div class="info"><b>${fmt(x.date)}</b> · Periodo ${fmt(x.from)} a ${fmt(x.to)}<br>Caja teórica ${money(Number(x.theoretical??x.amount??0))} · Física ${money(Number(x.physical??x.amount??0))} · Diferencia ${money(Number(x.difference||0))} · <span class="status ${x.status===\'CUADRADO\'?\'sGreen\':x.status===\'FALTANTE\'?\'sRed\':\'sOrange\'}">${x.status}</span></div>`);h+=\'</div>\';$(\'reportBox\').innerHTML=h;go(\'reports\')}\n'''
          pat2=r'function renderBalance\(\).*?function viewPortfolio\(\)\{'
          s3,n2=re.subn(pat2,new_funcs+'function viewPortfolio(){',s,count=1,flags=re.S)
          if n2!=1: raise SystemExit('No se encontró exactamente el bloque de funciones Balance')
          p.write_text(s3,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('No se encontraron scripts')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --check
          git diff --stat
      - name: Publicar cambio si la validacion pasa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mejorar Balance y conciliacion de caja de forma segura" || exit 0
          git push
      - name: Eliminar workflow temporal
        if: always()
        run: |
          rm -f .github/workflows/patch-balance-safe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar parche temporal de Balance seguro" || exit 0
          git push
