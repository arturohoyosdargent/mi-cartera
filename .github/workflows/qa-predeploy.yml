name: QA Préstamo Ya
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    if: ${{ !contains(github.event.head_commit.message, '[skip qa]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis — credit-detail-share-fix.js
        continue-on-error: true
        run: node --check credit-detail-share-fix.js
      - name: Sintaxis — firebase-cloud.js
        continue-on-error: true
        run: node --check firebase-cloud.js
      - name: Sintaxis — firebase-config.js
        continue-on-error: true
        run: node --check firebase-config.js
      - name: Sintaxis — sw.js
        continue-on-error: true
        run: node --check sw.js
      - name: Validar todos los archivos JavaScript
        run: |
          set +e
          bad=0
          while IFS= read -r -d '' f; do
            echo "Comprobando $f"
            if ! node --check "$f"; then
              echo "::error file=$f::JavaScript inválido"
              bad=1
            fi
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          if [ "$bad" -ne 0 ]; then exit 1; fi
      - name: Validar JavaScript embebido en index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          assert blocks
          for i,code in enumerate(blocks,1):
              p=Path(f'/tmp/index-inline-{i}.js');p.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: print(r.stderr);raise SystemExit(f'JavaScript inline inválido: bloque {i}')
          print(f'QA inline JS OK: {len(blocks)} bloques')
          PY
      - name: Validar index y PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          html=Path('index.html').read_text(encoding='utf-8')
          assert '<title>Préstamo Ya</title>' in html
          assert 'manifest.webmanifest' in html and 'icon.svg' in html
          assert html.count('firebase-config.js') == 1 and html.count('firebase-cloud.js') == 1 and html.count('firebase-cloud-core.js') == 0
          assert '<script src="backup.js"></script>' not in html
          start=html.find('<script>');marker=re.search(r'</script>\s*<script src="firebase-config\.js(?:\?[^\"]*)?"></script>',html[start:]);assert start>=0 and marker
          end=start+marker.start();assert '</script>' not in html[start+len('<script>'):end]
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          print('QA HTML/PWA OK')
          PY
      - name: Validar Service Worker y cache bust
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('firebase-cloud.js').read_text(encoding='utf-8');sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'navigator.serviceWorker.register' in s
          cache_match=re.search(r'prestamo_ya_cache_clean_v(\d+)',s); assert cache_match
          queue_match=re.search(r'sync-queue-v3\.js\?v=(\d+)',s); assert queue_match
          sw_match=re.search(r'sw\.js\?v=(\d+)',s); assert sw_match
          sw_cache=re.search(r"CACHE='prestamo-ya-v(\d+)'",sw); assert sw_cache
          assert int(cache_match.group(1)) >= 40
          assert int(queue_match.group(1)) >= 15
          assert int(sw_match.group(1)) >= 20
          assert int(sw_cache.group(1)) >= 20
          assert "credit-detail-share-fix.js?v=2" in s
          assert "credit-detail-share-fix.js" in sw
          print('QA Service Worker/cache bust OK')
          PY
      - name: Validar contrato de sincronización offline
        run: |
          python - <<'PY'
          from pathlib import Path
          q=Path('sync-queue-v3.js').read_text(encoding='utf-8');f=Path('firebase-cloud.js').read_text(encoding='utf-8');r=Path('client-sync-repair.js').read_text(encoding='utf-8')
          for x in ['window.syncQueueV3',"item.status='ENVIANDO'","item.status='SINCRONIZADO'","item.status='ERROR'",'item.error=','window.waitForCloudWrites','window.prestamoYaSyncDiagnostics','AUTH_NOT_READY','FIRESTORE_WRITE_TIMEOUT','FIRESTORE_PENDING_WRITES_TIMEOUT','windowDb']:
              assert x in q, f'Falta contrato de cola: {x}'
          assert "firstQ=await window.syncQueueV3()" in f
          assert "rawOk=await raw()" in f
          assert "secondQ=await window.syncQueueV3()" in f
          assert "window.ackQueueAfterCloudSync=()=>" in q
          assert "const routeAllowed=(p,item)=>" in q and "if(col==='credits')return true" in q
          assert "for(const item of queue){if(item?.status==='ENVIANDO')item.status='PENDIENTE'}" in q
          assert 'credit-modified-sync-fix.js' not in f
          assert 'no se mezcla' in r.lower() or 'fuente de verdad' in r.lower()
          print('QA contrato offline/Cloud OK')
          PY
      - name: Validar aislamiento de compartir
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path('credit-detail-share-fix.js').read_text(encoding='utf-8')
          engine=Path('share-image-engine.js').read_text(encoding='utf-8')
          loader=Path('firebase-cloud.js').read_text(encoding='utf-8')
          assert 'window.__prestamoYaCreditDetailShareFixV2' in d
          assert 'const bodyCreditId=' in d and 'b.dataset.creditId=id' in d
          assert 'window.__prestamoYaLastPaymentShare=null' in d
          assert "credit-detail-share-fix.js?v=2" in loader
          assert 'navigator.share' in d and 'prestamo-ya-detalle-credito.png' in d
          assert 'PAGO RECIBIDO' in engine
          assert 'PROPUESTA DE CRÉDITO' in engine
          assert 'credit-detail-share-fix.js' in Path('sw.js').read_text(encoding='utf-8')
          print('QA compartir: detalle/pago/propuesta aislados por contrato')
          PY
      - name: Detectar riesgos de loaders y handlers duplicados
        run: |
          python - <<'PY'
          from pathlib import Path
          alltxt='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in Path('.').glob('*.js'))
          for token in ['window.shareCreditDetail=','window.shareCreditDetailV2=','window.shareCreditProposal=','window.registerPayment=']:
              n=alltxt.count(token)
              print(token,n)
          assert alltxt.count('window.shareCreditDetailV2=') <= 2
          assert alltxt.count('window.shareCreditProposal=') <= 2
          print('QA duplicación/aislamiento de handlers OK')
          PY
      - name: Validar reglas Firestore
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('firestore.rules').read_text(encoding='utf-8')
          assert 'function validUserProfile(uid)' in s and 'request.resource.data.uid == uid' in s and 'me().routeIds is list' in s and 'function supervisor()' in s
          assert "collection in ['capital','entries','expenses','audit']" in s
          print('QA Firestore Rules OK')
          PY
      - name: Verificar estructura Cloud
        run: |
          for f in firebase-config.js firebase-cloud.js firebase-cloud-core.js sync-queue-v3.js cloud-repair.js cloud-repair-v2.js ownership-model.js field-collection-sync.js credit-proposal.js credit-proposal-ui.js payment-schedule-fix.js history-detail.js credit-rules-v3.js credit-renewal-v3.js renewal-balance-field.js renewal-form-v2.js credit-workflow-v4.js credit-share-v2.js sync-ui-fix.js renewal-buttons-fix.js renewal-final-fix.js renewal-schedule-correction.js address-navigation.js credit-final-fix.js cloud-ui-fixes.js session-switch.js data-integrity.js firestore.rules firebase.json functions/index.js credit-detail-share-fix.js; do test -f "$f"; done
          echo 'QA Cloud OK'
      - name: Publicar diagnóstico de sintaxis
        if: ${{ always() }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          rows=[]
          for p in sorted(Path('.').glob('*.js')):
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: rows.append((str(p),(r.stderr or r.stdout).strip()))
          out=['# QA — diagnóstico automático de sintaxis','',f'Archivos con error: {len(rows)}','']
          for p,e in rows: out += [f'## `{p}`','```text',e,'```','']
          if not rows: out += ['**Sin errores de sintaxis en archivos JS.**']
          Path('QA_SYNTAX_REPORT.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QA_SYNTAX_REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m 'qa: publicar diagnóstico de sintaxis [skip qa]'
          git push