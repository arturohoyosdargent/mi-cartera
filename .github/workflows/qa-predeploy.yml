name: QA Préstamo Ya
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar todos los archivos JavaScript
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' f; do
            echo "Comprobando $f"
            node --check "$f"
          done
      - name: Validar JavaScript embebido en index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          assert blocks, 'No se encontraron scripts inline'
          for i,code in enumerate(blocks,1):
              p=Path(f'/tmp/index-inline-{i}.js');p.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: print(r.stderr);raise SystemExit(f'JavaScript inline inválido: bloque {i}')
          print(f'QA inline JS OK: {len(blocks)} bloques')
          PY
      - name: Validar index y PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          html=Path('index.html').read_text(encoding='utf-8')
          assert '<title>Préstamo Ya</title>' in html
          assert 'manifest.webmanifest' in html
          assert 'icon.svg' in html
          assert html.count('firebase-config.js') == 1
          assert html.count('firebase-cloud.js') == 1
          assert html.count('firebase-cloud-core.js') == 0
          assert '<script src="backup.js"></script>' not in html
          start=html.find('<script>');marker=re.search(r'</script>\s*<script src="firebase-config\.js(?:\?[^\"]*)?"></script>',html[start:])
          assert start>=0 and marker
          end=start+marker.start();assert '</script>' not in html[start+len('<script>'):end]
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          print('QA HTML/PWA OK')
          PY
      - name: Validar registro real del Service Worker
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('firebase-cloud.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'navigator.serviceWorker.register' in s, 'El PWA no registra el Service Worker al arrancar'
          assert 'prestamo_ya_cache_clean_v28' in s, 'Falta el control de caché v28'
          assert "sync-queue-v3.js?v=6" in s, 'No se está cargando la cola v6'
          assert "CACHE='prestamo-ya-v10'" in sw, 'Falta el cache v10 del Service Worker'
          print('QA Service Worker/sync bootstrap OK')
          PY
      - name: Validar contrato de sincronización offline
        run: |
          python - <<'PY'
          from pathlib import Path
          q=Path('sync-queue-v3.js').read_text(encoding='utf-8')
          c=Path('firebase-cloud-core.js').read_text(encoding='utf-8')
          f=Path('firebase-cloud.js').read_text(encoding='utf-8')
          required_q=['window.ackQueueAfterCloudSync','window.syncQueueV3',"item.status='SINCRONIZADO'","item.status='ERROR'",'item.error=']
          for x in required_q: assert x in q, f'Falta contrato de cola: {x}'
          assert 'return true;' in c and "toast('Cloud sincronizado.')" in c
          assert "if(ok&&typeof window.ackQueueAfterCloudSync==='function')window.ackQueueAfterCloudSync();" in f
          assert "if(typeof window.syncQueueV3==='function')await window.syncQueueV3();" in f
          print('QA contrato offline/Cloud OK')
          PY
      - name: Validar reglas Firestore
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('firestore.rules').read_text(encoding='utf-8')
          assert 'function validUserProfile(uid)' in s
          assert 'request.resource.data.uid == uid' in s
          assert 'me().routeIds is list' in s
          assert 'function supervisor()' in s
          assert "collection in ['capital','entries','expenses','audit']" in s
          print('QA Firestore Rules OK')
          PY
      - name: Verificar estructura Cloud
        run: |
          for f in firebase-config.js firebase-cloud.js firebase-cloud-core.js sync-queue-v3.js cloud-repair.js cloud-repair-v2.js ownership-model.js field-collection-sync.js credit-proposal.js credit-proposal-ui.js payment-schedule-fix.js history-detail.js credit-rules-v3.js credit-renewal-v3.js renewal-balance-field.js renewal-form-v2.js credit-workflow-v4.js credit-share-v2.js sync-ui-fix.js renewal-buttons-fix.js renewal-final-fix.js renewal-schedule-correction.js address-navigation.js credit-final-fix.js cloud-ui-fixes.js session-switch.js data-integrity.js firestore.rules firebase.json functions/index.js; do test -f "$f"; done
          echo 'QA Cloud OK'
