name: QA Préstamo Ya
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar archivos JavaScript
        run: |
          node --check backup.js
          node --check sw.js
          node --check firebase-cloud.js
          node --check firebase-cloud-core.js
          node --check cloud-repair.js
          node --check cloud-repair-v2.js
          node --check ownership-model.js
          node --check field-collection-sync.js
          node --check credit-proposal.js
          node --check payment-schedule-fix.js
          node --check history-detail.js
          node --check credit-rules-v3.js
          node --check credit-renewal-v3.js
          node --check renewal-balance-field.js
          node --check renewal-form-v2.js
          node --check credit-workflow-v4.js
          node --check credit-share-v2.js
          node --check sync-ui-fix.js
          node --check renewal-buttons-fix.js
          node --check renewal-final-fix.js
          node --check renewal-schedule-correction.js
          node --check address-navigation.js
          node --check credit-final-fix.js
          node --check cloud-ui-fixes.js
          node --check session-switch.js
          node --check data-integrity.js
      - name: Validar JavaScript embebido en index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          assert blocks, 'No se encontraron scripts inline'
          for i,code in enumerate(blocks,1):
              p=Path(f'/tmp/index-inline-{i}.js')
              p.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stdout)
                  print(r.stderr)
                  raise SystemExit(f'JavaScript inline inválido: bloque {i}')
          print(f'QA inline JS OK: {len(blocks)} bloques')
          PY
      - name: Validar index y PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          html=Path('index.html').read_text(encoding='utf-8')
          assert '<title>Préstamo Ya</title>' in html
          assert 'manifest.webmanifest' in html
          assert 'icon.svg' in html
          assert html.count('firebase-config.js') == 1
          assert html.count('firebase-cloud.js') == 1
          assert html.count('firebase-cloud-core.js') == 0
          assert '<script src="backup.js"></script>' not in html
          start=html.find('<script>')
          marker=re.search(r'</script>\s*<script src="firebase-config\.js(?:\?[^\"]*)?"></script>',html[start:])
          assert start>=0 and marker
          end=start+marker.start()
          assert '</script>' not in html[start+len('<script>'):end]
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          print('QA HTML/PWA OK')
          PY
      - name: Validar reglas Firestore
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('firestore.rules').read_text(encoding='utf-8')
          assert 'function validUserProfile(uid)' in s
          assert 'request.resource.data.uid == uid' in s
          assert 'me().routeIds is list' in s
          assert 'function supervisor()' in s
          assert "collection in ['capital','entries','expenses','audit']" in s
          print('QA Firestore Rules OK')
          PY
      - name: Verificar estructura Cloud
        run: |
          for f in firebase-config.js firebase-cloud.js firebase-cloud-core.js cloud-repair.js cloud-repair-v2.js ownership-model.js field-collection-sync.js credit-proposal.js payment-schedule-fix.js history-detail.js credit-rules-v3.js credit-renewal-v3.js renewal-balance-field.js renewal-form-v2.js credit-workflow-v4.js credit-share-v2.js sync-ui-fix.js renewal-buttons-fix.js renewal-final-fix.js renewal-schedule-correction.js address-navigation.js credit-final-fix.js cloud-ui-fixes.js session-switch.js data-integrity.js firestore.rules firebase.json functions/index.js; do test -f "$f"; done
          echo 'QA Cloud OK'
