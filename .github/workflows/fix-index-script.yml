name: Fix index script parsing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-index-script.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch all inline script terminators
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          start = s.find('<script>\nconst KEY=')
          marker = '\n</script>\n<script src="firebase-config.js'
          end = s.find(marker, start)
          if start < 0 or end < 0:
              raise SystemExit('No se encontró el script principal')
          body_start = start + len('<script>')
          body = s[body_start:end]
          # The HTML parser treats every literal </script> as the end of the
          # current script, even when it appears inside a JavaScript string.
          # Escape every such terminator inside the main JS body.
          body = body.replace('</script>', '<\\/script>')
          s = s[:body_start] + body + s[end:]
          s = s.replace('<h1 id="title">Mi Cartera</h1>', '<h1 id="title">Préstamo Ya</h1>')
          s = s.replace("{home:'Mi Cartera'", "{home:'Préstamo Ya'")
          s = s.replace("||'Mi Cartera'", "||'Préstamo Ya'")
          if s == old:
              print('No changes needed')
          else:
              p.write_text(s, encoding='utf-8')
              print('index.html patched')
          PY
      - name: Validate HTML script balance
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          print('script tags:', s.count('<script'), 'closing tags:', s.count('</script>'))
          start = s.find('<script>\nconst KEY=')
          marker = '\n</script>\n<script src="firebase-config.js'
          end = s.find(marker, start)
          assert start >= 0 and end > start
          body = s[start + len('<script>'):end]
          assert '</script>' not in body, 'Hay un cierre </script> sin escapar dentro del JS principal'
          assert s.count('<script') == s.count('</script>'), 'Etiquetas script desbalanceadas'
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix remaining inline script terminator'
          git push
