name: Fix index script parsing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-index-script.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch broken inline script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('<script src="backup.js"></script>', '<script src="backup.js"><\\/script>')
          s = s.replace('navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>', 'navigator.serviceWorker.register("sw.js").catch(()=>{});}<\\/script>')
          s = s.replace('<h1 id="title">Mi Cartera</h1>', '<h1 id="title">Préstamo Ya</h1>')
          s = s.replace("{home:'Mi Cartera'", "{home:'Préstamo Ya'")
          s = s.replace("||'Mi Cartera'", "||'Préstamo Ya'")
          if s == old:
              print('No changes needed')
          else:
              p.write_text(s, encoding='utf-8')
              print('index.html patched')
          PY
      - name: Validate HTML script balance
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          print('script tags:', s.count('<script'), 'closing tags:', s.count('</script>'))
          assert '<script src="backup.js"></script>' not in s
          assert 'navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>' not in s
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix index script parsing and brand'
          git push
