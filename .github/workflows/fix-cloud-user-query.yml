name: Fix Cloud user query

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pullUsers query
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('firebase-cloud-core.js')
          s=p.read_text(encoding='utf-8')
          old="async function pullUsers(){const snap=await getDocs(collection(fs,'users'));return snap.docs.map(d=>d.data());}"
          new="async function pullUsers(){const q=query(collection(fs,'users'),where('orgId','==',orgId));const snap=await getDocs(q);return snap.docs.map(d=>d.data());}"
          if old not in s:
              raise SystemExit('pullUsers pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('patched pullUsers')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firebase-cloud-core.js
          git commit -m 'Fix Cloud user query by organization' || exit 0
          git push
