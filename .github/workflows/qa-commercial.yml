name: QA Comercial Préstamo Ya
on:
  push:
    branches: [commercial-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript comercial
        run: |
          set -e
          node --check tenant-context.js
          node --check commercial-admin.js
          node --check share-image-engine.js
          node --check payment-methods.js
          node tests/tenant-context.test.js
          node tests/commercial-admin.test.js
      - name: Validar contrato multiempresa
        run: |
          python - <<'PY'
          from pathlib import Path
          rules=Path('firestore.rules').read_text(encoding='utf-8')
          arch=Path('docs/TENANT_ARCHITECTURE.md').read_text(encoding='utf-8')
          assert 'function sameOrg(org)' in rules
          assert 'me().orgId == org' in rules
          assert 'function assignedRoute(rid)' in rules
          assert 'orgs/{orgId}/clients/{id}' in rules
          assert 'orgs/{orgId}/credits/{id}' in rules
          assert 'orgs/{orgId}/payments/{id}' in rules
          assert 'Ningún usuario de una empresa A' in Path('docs/COMMERCIAL_V1.md').read_text(encoding='utf-8')
          assert 'Platform Admin' in arch and 'Org Admin' in arch
          assert 'commercial-admin.js' in Path('README.md').read_text(encoding='utf-8')
          print('QA multiempresa/comercial OK')
          PY
      - name: Validar compartir visual y medios de pago
        run: |
          set -e
          grep -q "share-image-engine.js?v=1" firebase-cloud.js
          grep -q "payment-methods.js?v=1" firebase-cloud.js
          grep -q "navigator.share" share-image-engine.js
          grep -q "OTROS" payment-methods.js
          grep -q "Yape/Plin" payment-methods.js
          grep -q "Efectivo" payment-methods.js || true
          echo 'QA compartir/medios de pago OK'
      - name: Validar producción intacta
        run: |
          test -f index.html
          test -f firebase-cloud.js
          test -f firebase-cloud-core.js
          test -f sync-queue-v3.js
          test -f firestore.rules
          echo 'Base operativa presente'
